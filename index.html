<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaceship Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The game area. Same size as the Figma frame "Game Screen" (402 x 874). -->
  <div id="game">

    <!-- Figma layer: "Timer" -->
    <div id="timer">
      <span>Time:</span>
      <span id="timer-text">0m 0s</span>
    </div>

    <!-- Figma layer: "Pause" (top-right hint) -->
    <div id="pause-hint">
      <span class="key-small">P</span>
      <span>Pause</span>
    </div>

    <!-- Figma layer: "Player" -->
    <img id="player" src="assets/player.svg" alt="Spaceship">

    <!-- Figma layer: "Stamina Indicator" (shot energy) -->
    <div id="stamina">
      <svg width="76" height="76" viewBox="0 0 76 76">
        <!-- pathLength="100" lets game.js trim the ring with simple 0-100 numbers -->
        <circle id="stamina-ring" cx="38" cy="38" r="33" pathLength="100" />
      </svg>
      <img src="assets/bullet-icon.svg" alt="">
    </div>

    <!-- Monsters, meteors and bullets are added here by game.js while you play. -->

    <!-- Figma layer: "Pause Overlay" — shown when you press P -->
    <div id="pause-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <div class="overlay-title">
          <div class="pause-icon"><span></span><span></span></div>
          <h2>Game Paused</h2>
        </div>
        <div class="instruction">
          <span class="text-medium">Tap</span>
          <span class="key">P</span>
          <span class="text-medium">to resume</span>
        </div>
      </div>
    </div>

    <!-- Figma layer: "Game Over Overlay" — shown when you lose -->
    <div id="game-over" class="overlay" hidden>
      <div class="overlay-card">
        <h2>Game Over</h2>
        <div class="score">
          <span class="score-label">Your score</span>
          <span id="final-time" class="score-time">0m 0s</span>
        </div>
        <div class="instruction">
          <span class="text-medium">Tap</span>
          <span class="key">S</span>
          <span class="text-medium">to restart</span>
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
